# ~/vpn-selection.conf   (in salt-configs-vm)
#
# The only file you normally edit. dom0 reads it with vpn-params-fetch, which
# validates every value below against a whitelist before it is used. Unknown
# keys are a hard error.
#
# This file holds PARAMETERS ONLY -- never code, never paths into the other
# qube. dom0 alone decides which qube the VPN configs come from.

# wireguard | openvpn
protocol=wireguard

# Transport the dom0 firewall whitelists: udp | tcp. Optional, defaults to udp.
# WireGuard is always udp. OpenVPN may be either, and picking the wrong one
# means the endpoint is silently unreachable, so set it explicitly if you use
# a tcp OpenVPN endpoint.
transport=udp

# Tunnel MTU, also applied to downstream vif interfaces. 1280-1500.
# 1420 = stock WireGuard over a 1500-byte uplink.
mtu=1420

# Which server:
#   two-letter ISO country code   -> random server in that country, re-picked
#                                    at every boot of the disposable
#   country code + server number  -> that exact server
# e.g.   uk      (random UK)
#        uk123   (specific)
selector=uk123

# Provider prefix used when naming the qubes.
provider=nordvpn

# Which of several random qubes for the same country this is. 1-99.
# Optional, defaults to 1. ONLY valid with a country-only selector -- a
# specific server already names itself uniquely, so setting it there is an
# error rather than a no-op.
#
# The qube names are derived as:
#     <provider>-<iso>-r<N>-vpn    (country-only selector; r = random)
#     <provider>-<server>-vpn      (specific selector)
#
# so selector=uk gives nordvpn-uk-r1-vpn, and a second independent
# random-UK qube needs instance=2. The first one is numbered too, on purpose:
# an unnumbered "uk-r" would read as though a number had been forgotten,
# and renaming it later means re-pointing the netvm of every qube behind it.
#instance=1

# What this VPN qube connects OUT through. Optional.
#
#   sys-firewall          the usual choice
#   <another-vpn-qube>    chain this tunnel inside that one
#   none                  build it now, attach an uplink by hand later
#
# DEFAULTS TO none IF ABSENT, not to sys-firewall. An omitted key must never
# hand a qube a network path nobody asked for -- the same fail-closed stance
# the dvm template takes. A qube built with no uplink is complete in every
# other way (firewall applied, configs delivered); its tunnel simply cannot
# come up until you run:  qvm-prefs <disposable> netvm <qube>
#
# If you chain, the inner tunnel's mtu must fit inside the outer one --
# roughly 60 bytes per WireGuard hop, more for OpenVPN. vpn-build-all checks
# this across a set of configs; a single vpn-build cannot, because it only
# ever sees one file.
uplink=sys-firewall
