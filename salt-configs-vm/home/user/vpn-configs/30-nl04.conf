# 30-nl04.conf -- built now, attached later.
#
# uplink=none is a deliberate choice, not a failure: the qube is created, the
# firewall is applied and the configs are delivered, but it has no way out
# until you give it one:
#
#     qvm-prefs nordvpn-nl04-vpn netvm <sys-firewall|another-vpn-qube>
#
# Because there is no parent at build time, this is the one config whose mtu
# cannot be checked against anything. Making it fit whatever you attach it to
# later is on you.
#
# A config with uplink=none has no ordering constraint at all, so its number
# only decides when it is built, nothing more.

protocol=wireguard
transport=udp
mtu=1420
selector=nl04
provider=nordvpn
uplink=none
