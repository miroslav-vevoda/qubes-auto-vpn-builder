# 20-de77.conf -- chained INSIDE the qube built by 10-uk123.conf.
#
# mtu is 1360, not 1420: this tunnel runs through the 1420 one, and WireGuard
# costs about 60 bytes a hop. vpn-build-all refuses the set if this does not
# descend correctly. Leaving it at 1420 gives a tunnel where ping works and
# anything large disappears.
#
# The uplink names the DISPOSABLE built by 10-uk123.conf (not its -dvm
# template, which never runs).

protocol=wireguard
transport=udp
mtu=1360
selector=de77
provider=nordvpn
uplink=nordvpn-uk123-vpn
